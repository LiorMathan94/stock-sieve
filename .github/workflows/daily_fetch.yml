name: Daily data refresh

on:
  schedule:
    - cron: "0 6 * * 2-6"  # 06:00 UTC Tue-Sat, i.e. after each US trading day closes
  workflow_dispatch: {}

concurrency:
  group: daily-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # ~2.7x more tickers now that the universe covers US + EU
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Exits non-zero (failing the run, which emails the repo owner) if most
      # tickers can't be fetched; the previous data file is left untouched.
      - name: Fetch fundamentals
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python fetch_data.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stocks.json
          git diff --cached --quiet && exit 0
          git commit -m "Daily data refresh"
          git pull --rebase
          git push
